apiVersion: 1

# Read-only reporting database that lives outside this project. Credentials come
# from compose/local/.env so they are never committed. See .env.sample.
datasources:
  - name: finance
    uid: finance-postgres
    type: postgres
    access: proxy
    url: $FINANCE_DB_URL
    database: $FINANCE_DB_NAME
    user: $FINANCE_DB_USER
    isDefault: false
    editable: false
    secureJsonData:
      password: $FINANCE_DB_PASSWORD
    jsonData:
      sslmode: disable
      postgresVersion: 1700
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      timescaledb: false
