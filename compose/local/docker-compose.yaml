services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: news2
      POSTGRES_USER: news2
      POSTGRES_PASSWORD: news2
    ports:
      - "15432:5432"
    volumes:
      - psql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news2 -d news2"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "16379:6379"
    volumes:
      - redis:/data

  grafana:
    image: grafana/grafana:12.0.0
    ports:
      - "13000:3000"
    environment:
      # These credentials are only applied when the grafana volume is first
      # created. Changing them later requires `grafana cli admin
      # reset-admin-password` inside the container, or recreating the volume.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: pwd
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      db:
        condition: service_healthy

volumes:
  psql:
  redis:
  grafana:
