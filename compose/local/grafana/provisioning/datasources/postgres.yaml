apiVersion: 1

# 로컬 Docker의 finance DB만 사용한다. 이전 이름과 외부 DB datasource는 기존 Grafana
# 볼륨에도 남지 않게 제거한다.
deleteDatasources:
  - name: news2
    orgId: 1
  - name: external-finance
    orgId: 1

datasources:
  # uid는 DB 이름이 아니라 대시보드가 참조하는 안정 식별자라 그대로 둔다.
  - name: finance
    uid: news2-postgres
    type: postgres
    access: proxy
    url: db:5432
    user: finance
    isDefault: true
    editable: false
    secureJsonData:
      password: finance
    jsonData:
      # Grafana 11부터 Postgres 접속 DB는 최상위 database가 아니라 jsonData.database다.
      # 최상위에 두면 백엔드만 읽어서 프런트엔드가 쿼리를 보내지 않고 패널이 전부 No data가 된다.
      database: finance
      sslmode: disable
      postgresVersion: 1700
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      timescaledb: false
