services:
  db:
    image: paradedb/paradedb:0.25.2-pg17
    command: postgres -c shared_preload_libraries=pg_search
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
    ports:
      - "15432:5432"
    volumes:
      - psql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "16379:6379"
    volumes:
      - redis:/data

  grafana:
    image: grafana/grafana:12.0.0
    ports:
      - "13000:3000"
    environment:
      # These credentials are only applied when the grafana volume is first
      # created. Changing them later requires `grafana cli admin
      # reset-admin-password` inside the container, or recreating the volume.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: pwd
      GF_USERS_DEFAULT_THEME: dark
      # Datasource connection details. The provisioning YAML files read these names,
      # so switching a dashboard to another database means editing compose/local/.env
      # and recreating grafana - no file under grafana/provisioning changes.
      # Defaults point at the db service in this compose file.
      NEWS_DB_URL: ${NEWS_DB_URL:-db:5432}
      NEWS_DB_NAME: ${NEWS_DB_NAME:-finance}
      NEWS_DB_USER: ${NEWS_DB_USER:-finance}
      NEWS_DB_PASSWORD: ${NEWS_DB_PASSWORD:-finance}
      FINANCE_DB_URL: ${FINANCE_DB_URL:-}
      FINANCE_DB_NAME: ${FINANCE_DB_NAME:-}
      FINANCE_DB_USER: ${FINANCE_DB_USER:-}
      FINANCE_DB_PASSWORD: ${FINANCE_DB_PASSWORD:-}
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      db:
        condition: service_healthy

volumes:
  psql:
  redis:
  grafana:
