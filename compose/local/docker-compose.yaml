services:
  db:
    image: paradedb/paradedb:0.25.2-pg17
    command: postgres -c shared_preload_libraries=pg_search
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
    ports:
      - "15432:5432"
    volumes:
      - psql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "16379:6379"
    volumes:
      - redis:/data

  neo4j:
    image: neo4j:5.26.29-community
    environment:
      NEO4J_AUTH: neo4j/finance1234
    ports:
      - "17474:7474"
      - "17687:7687"
    volumes:
      - neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p finance1234 'RETURN 1'"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:13.0-slim
    ports:
      - "13000:3000"
    environment:
      # These credentials are only applied when the grafana volume is first
      # created. Changing them later requires `grafana cli admin
      # reset-admin-password` inside the container, or recreating the volume.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: pwd
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      db:
        condition: service_healthy

volumes:
  psql:
  redis:
  neo4j:
  grafana:
