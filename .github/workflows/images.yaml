# 운영 이미지 빌드. main에 코드가 들어오면 Airflow·KIS 실시간 이미지를 GHCR에 올린다.
# 배포는 homelab 저장소의 Flux image automation이 새 태그를 받아 k3s에 반영한다.
#
# 태그는 main-<UTC 시각>-<짧은 SHA>다. 시각이 앞이라 문자열 정렬이 곧 최신순이고,
# Flux ImagePolicy가 그 순서로 가장 새 태그를 고른다.
name: images

on:
  push:
    branches: [main]
    paths:
      - airflow/**
      - apps/**
      - compose/prod/**
      - .dockerignore
      - .github/workflows/images.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: finance-airflow
            dockerfile: compose/prod/airflow/Dockerfile
          - image: finance-kis-realtime
            dockerfile: compose/prod/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=main-$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # k3s 노드 중 이 이미지를 돌리는 쪽(k3s-master)이 amd64다.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
